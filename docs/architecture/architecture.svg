<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 648" role="img" aria-labelledby="title desc">
  <title id="title">Lumind Intelligence API - Architecture Overview</title>
  <desc id="desc">Request flow from client through controllers, services, repositories, and PostgreSQL, with JWT security, OpenAPI, Flyway, and AI analysis path via Gemini stub.</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#374151"/>
    </marker>
    <marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <style>
      .layer-title { font: 600 13px system-ui, -apple-system, Segoe UI, sans-serif; fill: #111827; }
      .label { font: 12px system-ui, -apple-system, Segoe UI, sans-serif; fill: #1f2937; }
      .label-sm { font: 11px system-ui, -apple-system, Segoe UI, sans-serif; fill: #374151; }
      .label-muted { font: 11px system-ui, -apple-system, Segoe UI, sans-serif; fill: #6b7280; }
      .box { fill: #ffffff; stroke: #4b5563; stroke-width: 1.2; }
      .box-layer { fill: #f9fafb; stroke: #6b7280; stroke-width: 1.4; }
      .box-infra { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .chip { fill: #ffffff; stroke: #9ca3af; stroke-width: 1; }
      .chip-ai { fill: #ffffff; stroke: #6b7280; stroke-width: 1.1; }
    </style>
  </defs>

  <rect class="box" x="470" y="16" width="240" height="44" rx="4"/>
  <text class="label" x="590" y="44" text-anchor="middle">Client (HTTP / REST)</text>

  <line x1="590" y1="60" x2="590" y2="78" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect class="box-infra" x="320" y="80" width="540" height="52" rx="4"/>
  <text class="layer-title" x="590" y="102" text-anchor="middle">Cross-cutting: Spring Security (stateless JWT)</text>
  <text class="label-sm" x="590" y="120" text-anchor="middle">JwtAuthenticationFilter, Bearer access token, refresh tokens (hashed in DB)</text>

  <line x1="590" y1="132" x2="590" y2="152" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect class="box-layer" x="40" y="154" width="1100" height="108" rx="6"/>
  <text class="layer-title" x="56" y="176">REST API - Controllers</text>
  <text class="label-muted" x="56" y="192">DTO in/out, Bean Validation, MapStruct mappers</text>

  <g transform="translate(56, 204)">
    <rect class="chip" x="0" y="0" width="72" height="36" rx="3"/>
    <text class="label-sm" x="36" y="22" text-anchor="middle">Auth</text>
    <rect class="chip" x="84" y="0" width="72" height="36" rx="3"/>
    <text class="label-sm" x="120" y="22" text-anchor="middle">Habits</text>
    <rect class="chip" x="168" y="0" width="64" height="36" rx="3"/>
    <text class="label-sm" x="200" y="22" text-anchor="middle">Tasks</text>
    <rect class="chip" x="244" y="0" width="88" height="36" rx="3"/>
    <text class="label-sm" x="288" y="22" text-anchor="middle">Pomodoro</text>
    <rect class="chip" x="344" y="0" width="88" height="36" rx="3"/>
    <text class="label-sm" x="388" y="22" text-anchor="middle">Statistics</text>
    <rect class="chip-ai" x="444" y="0" width="48" height="36" rx="3"/>
    <text class="label-sm" x="468" y="22" text-anchor="middle">AI</text>
  </g>

  <rect class="box-infra" x="900" y="168" width="220" height="48" rx="4"/>
  <text class="label-sm" x="1010" y="190" text-anchor="middle">OpenAPI / Swagger UI</text>
  <text class="label-muted" x="1010" y="206" text-anchor="middle">SpringDoc, API documentation</text>
  <path d="M 880 192 L 900 192" stroke="#6b7280" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/>

  <line x1="590" y1="262" x2="590" y2="282" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect class="box-layer" x="40" y="284" width="720" height="200" rx="6"/>
  <text class="layer-title" x="56" y="306">Application - Services (business rules and orchestration)</text>
  <text class="label-muted" x="56" y="322">Ownership checks, domain validation, transaction boundaries</text>

  <g transform="translate(56, 336)">
    <rect class="chip" x="0" y="0" width="120" height="32" rx="3"/>
    <text class="label-sm" x="60" y="20" text-anchor="middle">AuthService</text>
    <rect class="chip" x="0" y="40" width="140" height="32" rx="3"/>
    <text class="label-sm" x="70" y="60" text-anchor="middle">RefreshTokenService</text>
    <rect class="chip" x="152" y="0" width="100" height="32" rx="3"/>
    <text class="label-sm" x="202" y="20" text-anchor="middle">HabitService</text>
    <rect class="chip" x="152" y="40" width="96" height="32" rx="3"/>
    <text class="label-sm" x="200" y="60" text-anchor="middle">TaskService</text>
    <rect class="chip" x="264" y="0" width="148" height="32" rx="3"/>
    <text class="label-sm" x="338" y="20" text-anchor="middle">PomodoroSessionService</text>
    <rect class="chip" x="264" y="40" width="200" height="32" rx="3"/>
    <text class="label-sm" x="364" y="60" text-anchor="middle">ProductivityStatisticsService</text>
  </g>

  <rect class="box-layer" x="780" y="284" width="360" height="200" rx="6"/>
  <text class="layer-title" x="796" y="306">AI productivity analysis (in-process)</text>
  <text class="label-muted" x="796" y="322">Statistics loaded before model call</text>

  <g transform="translate(796, 338)">
    <rect class="chip-ai" x="0" y="0" width="328" height="28" rx="3"/>
    <text class="label-sm" x="164" y="18" text-anchor="middle">ProductivityAnalysisService</text>
    <line x1="164" y1="28" x2="164" y2="38" stroke="#374151" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect class="chip-ai" x="0" y="40" width="328" height="28" rx="3"/>
    <text class="label-sm" x="164" y="58" text-anchor="middle">ProductivityStatisticsService</text>
    <line x1="164" y1="68" x2="164" y2="78" stroke="#374151" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect class="chip-ai" x="0" y="80" width="328" height="28" rx="3"/>
    <text class="label-sm" x="164" y="98" text-anchor="middle">ProductivityAnalysisPromptBuilder</text>
    <line x1="164" y1="108" x2="164" y2="118" stroke="#374151" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect class="chip-ai" x="0" y="120" width="328" height="28" rx="3"/>
    <text class="label-sm" x="164" y="138" text-anchor="middle">AiLanguageModelClient (interface)</text>
    <line x1="164" y1="148" x2="164" y2="158" stroke="#374151" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect class="chip-ai" x="0" y="160" width="328" height="28" rx="3"/>
    <text class="label-sm" x="164" y="178" text-anchor="middle">GeminiClient (HTTP stub, v1.0)</text>
  </g>

  <path d="M 524 240 L 760 240 L 760 300 L 780 300" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/>
  <text class="label-muted" x="642" y="232" text-anchor="middle">from AiController</text>

  <line x1="400" y1="484" x2="400" y2="504" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="590" y1="484" x2="590" y2="504" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect class="box-layer" x="40" y="506" width="1100" height="72" rx="6"/>
  <text class="layer-title" x="56" y="528">Persistence - Spring Data JPA Repositories</text>
  <text class="label-muted" x="56" y="544">User, RefreshToken, Habit, Task, PomodoroSession, and related entities</text>
  <text class="label-sm" x="56" y="564">Entities mapped to PostgreSQL; ddl-auto: validate</text>

  <line x1="590" y1="578" x2="590" y2="596" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g transform="translate(340, 598)">
    <rect class="box" x="0" y="0" width="200" height="44" rx="4"/>
    <text class="label" x="100" y="28" text-anchor="middle">PostgreSQL</text>
    <rect class="box-infra" x="240" y="0" width="160" height="44" rx="4"/>
    <text class="label-sm" x="320" y="20" text-anchor="middle">Flyway</text>
    <text class="label-muted" x="320" y="36" text-anchor="middle">Schema migrations V1-V6</text>
    <path d="M 200 22 L 240 22" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow-muted)"/>
  </g>

  <text class="label-muted" x="40" y="638">Shared: common (exceptions, utilities), config (Security, JWT, OpenAPI, Gemini)</text>
</svg>
